<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - NeuroSense</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="login-container">
            <div class="logo-section">
                <h1>NeuroSense</h1>
                <p class="tagline">Password Recovery</p>
            </div>
            <div class="login-form">
                <h2>Forgot Password</h2>
                <p class="instruction-text">Enter your email address and user type to reset your password.</p>
                <form id="forgotPasswordForm">
                    <div class="form-group">
                        <label for="email"><i class="fas fa-envelope"></i></label>
                        <input type="email" id="email" name="email" placeholder="Email Address" required>
                    </div>
                    <div class="form-group">
                        <label for="userType"><i class="fas fa-user-md"></i></label>
                        <select id="userType" name="userType" required title="User Type">
                            <option value="">Select User Type</option>
                            <option value="patient">Patient</option>
                            <option value="consultant">Consultant</option>
                            <option value="jr_doctor">Jr. Doctor</option>
                        </select>
                    </div>
                    <button type="submit" class="login-btn">Reset Password</button>
                </form>
                <div class="additional-options">
                    <span>Remember your password?</span>
                    <a href="index.html">Login</a>
                </div>
            </div>
        </div>
    </div>
    <script src="js/forgot-password.js"></script>
</body>
</html>
